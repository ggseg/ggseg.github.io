meta:
  name: ggseg
  link: https://ggseg.github.io

color:
  palette:
    teal-dark: "#29393e"
    teal-light: "#a8c5cb"
    mauve: "#cec4cc"
    plum: "#5e3c58"
    slate-900: "#1a2a2e"
    white: "#f2f0ef"
    success: "#478f76"
    danger: "#CD6689"
    warning: "#e5a663"
  primary:
    light: teal-dark
    dark: teal-light
  secondary:
    light: plum
    dark: mauve
  tertiary:
    light: teal-light
    dark: teal-dark
  foreground:
    light: slate-900
    dark: white
  background:
    light: white
    dark: slate-900
  success: success
  danger: danger


logo:
  medium:
    light: images/logo_dark.png
    dark: images/logo_light.png

typography:
  fonts:
    - family: Inter
      source: google
    - family: JetBrains Mono
      source: google
  link:
    color:
      light: teal-dark
      dark: teal-light
  monospace: JetBrains Mono
  monospace-block:
    background-color:
      light: mauve
      dark: teal-dark
